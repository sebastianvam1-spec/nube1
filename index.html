<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Aplicación de Derivadas</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mathjs@11/lib/browser/math.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background: #f4f6f8;
    }
    h1 {
      color: #2c3e50;
    }
    input, button {
      padding: 10px;
      font-size: 16px;
      margin: 5px;
    }
    canvas {
      background: white;
      border: 1px solid #ccc;
      margin-top: 20px;
    }
  </style>
</head>
<body>

<h1>📈 Calculadora de Derivadas</h1>

<p>Escribe una función en términos de <b>x</b> (ejemplo: x^2, sin(x), exp(x)):</p>

<input type="text" id="funcion" placeholder="Ej: x^2 + 3*x">
<button onclick="graficar()">Graficar</button>

<canvas id="grafica" width="800" height="400"></canvas>

<script>
let chart;

function derivadaNumerica(f, x) {
  let h = 0.0001;
  return (f(x + h) - f(x - h)) / (2 * h);
}

function graficar() {
  const input = document.getElementById("funcion").value;

  let f;
  try {
    f = math.compile(input);
  } catch (e) {
    alert("Error en la función");
    return;
  }

  let xs = [];
  let ys = [];
  let dydx = [];

  for (let x = -10; x <= 10; x += 0.2) {
    try {
      let y = f.evaluate({x: x});
      let dy = derivadaNumerica((val) => f.evaluate({x: val}), x);

      xs.push(x);
      ys.push(y);
      dydx.push(dy);
    } catch {
      xs.push(x);
      ys.push(null);
      dydx.push(null);
    }
  }

  if (chart) chart.destroy();

  const ctx = document.getElementById('grafica').getContext('2d');

  chart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: xs,
      datasets: [
        {
          label: 'Función f(x)',
          data: ys,
          borderColor: 'blue',
          fill: false
        },
        {
          label: 'Derivada f\'(x)',
          data: dydx,
          borderColor: 'red',
          fill: false
        }
      ]
    },
    options: {
      responsive: true,
      scales: {
        x: {
          title: { display: true, text: 'x' }
        },
        y: {
          title: { display: true, text: 'y' }
        }
      }
    }
  });
}
</script>

</body>
</html>
