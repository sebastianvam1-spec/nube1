<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Calculadora de Derivadas Avanzada</title>

  <!-- Librerías -->
  <script src="https://cdn.jsdelivr.net/npm/mathjs@11/lib/browser/math.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background: #eef2f7;
    }
    h1 {
      color: #2c3e50;
    }
    input, button {
      padding: 10px;
      font-size: 16px;
      margin: 5px 0;
    }
    #resultado {
      margin-top: 15px;
      padding: 10px;
      background: #fff;
      border-left: 4px solid #3498db;
    }
    canvas {
      background: white;
      border: 1px solid #ccc;
      margin-top: 20px;
    }
  </style>
</head>
<body>

<h1>📘 Calculadora de Derivadas</h1>

<p>Escribe una función (ej: <b>x^2 + 3*x</b>, <b>sin(x)</b>, <b>exp(x)</b>):</p>

<input type="text" id="funcion" placeholder="Ej: x^2 + 3*x">
<br>
<button onclick="calcular()">Calcular y Graficar</button>

<div id="resultado"></div>

<canvas id="grafica" width="800" height="400"></canvas>

<script>
let chart;

function calcular() {
  const input = document.getElementById("funcion").value;

  let expr, derivada;
  try {
    expr = math.parse(input);
    derivada = math.derivative(expr, 'x');
  } catch (e) {
    alert("Error en la función");
    return;
  }

  // Mostrar resultado
  document.getElementById("resultado").innerHTML = `
    <b>Función:</b> f(x) = ${expr.toString()} <br>
    <b>Derivada:</b> f'(x) = ${derivada.toString()}
  `;

  let f = expr.compile();
  let df = derivada.compile();

  let xs = [];
  let ys = [];
  let dys = [];

  for (let x = -10; x <= 10; x += 0.2) {
    try {
      xs.push(x);
      ys.push(f.evaluate({x: x}));
      dys.push(df.evaluate({x: x}));
    } catch {
      xs.push(x);
      ys.push(null);
      dys.push(null);
    }
  }

  if (chart) chart.destroy();

  const ctx = document.getElementById('grafica').getContext('2d');

  chart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: xs,
      datasets: [
        {
          label: 'f(x)',
          data: ys,
          borderColor: 'blue',
          fill: false
        },
        {
          label: "f'(x)",
          data: dys,
          borderColor: 'red',
          fill: false
        }
      ]
    },
    options: {
      responsive: true,
      interaction: {
        mode: 'index',
        intersect: false
      },
      plugins: {
        legend: {
          position: 'top'
        }
      },
      scales: {
        x: {
          title: { display: true, text: 'x' }
        },
        y: {
          title: { display: true, text: 'y' }
        }
      }
    }
  });
}
</script>

</body>
</html>
